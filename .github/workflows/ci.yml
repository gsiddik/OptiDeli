name: OptiDeli checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_DB: optideli_test
          POSTGRES_USER: optideli
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U optideli -d optideli_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: optideli_test
      DB_USERNAME: optideli
      DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t optideli-dev-php -f docker/php.Dockerfile docker
      - run: ./scripts/composer install --no-interaction --prefer-dist
      - run: ./scripts/composer validate --strict
      - run: ./scripts/php vendor/bin/pint --test
      - run: ./scripts/php vendor/bin/phpunit
  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check && npm run lint && npm test && npm run build
