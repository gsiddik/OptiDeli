name: optideli
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: optideli
      POSTGRES_USER: optideli
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment settings or a local env file}
    ports: ["127.0.0.1:${DB_PORT:-5544}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U optideli -d optideli"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: optideli-dev-php
    build:
      context: docker
      dockerfile: php.Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/backend
    volumes: [".:/app"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY using php artisan key:generate}
      APP_URL: http://localhost:5180
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: optideli
      DB_USERNAME: optideli
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      OPTIDELI_DEPLOYMENT_MODE: ${OPTIDELI_DEPLOYMENT_MODE:-standalone}
      OPTIDELI_STANDALONE_TENANT: ${OPTIDELI_STANDALONE_TENANT:-demo}
      OPTIDELI_IDENTITY_MODE: local
    ports: ["127.0.0.1:8300:8300"]
    depends_on:
      db: {condition: service_healthy}
    command: [php, artisan, serve, --host=0.0.0.0, --port=8300, --no-reload]
volumes:
  pgdata:
